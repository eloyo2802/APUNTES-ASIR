<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Adivina el Número</title>
<link rel="stylesheet" href="main.css">
</head>

<body>

<div class="contenedor">

<h2>ADIVINA EL NUMERO</h2>

<td id="intento4">4</td>
<td id="intento5">5</td>
<td id="intento6">6</td>
<td id="intento7">7</td>
<td id="intento8">8</td>
<td id="intento9">9</td>
<td id="intento10">10</td>
</tr>
</table>

</div>

<script src="script.js"></script>

</body>
</html>
